<style>:root{--bg:#f3f5f3;--card:#fff;--tx:#17211c;--mu:#68756d;--bd:#e2e9e4;--ac:#08784e;--ac2:#e5f3eb;--rd:#b42318;--shadow:0 8px 28px rgba(19,42,29,.055)}

imor-Leste","Togo","Tonga","Trinidad and Tobago","Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates","United Kingdom","United States","Uruguay","Uzbekistan","Vanuatu","Vatican City","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"];

const fmtDate=v=>v?new Date(v).toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}):'Date not recorded';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const wa=p=>{p=String(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='234'+p.slice(1);return p};
const STG=['New','Contacted','Viewing booked','Offer made','Closed – won','Lost'];
const SRC=['WhatsApp','Signboard','Walk-in','Facebook','Instagram','Referral','Jiji/PropertyPro','Other'];
const PLAN=['Confirm price against 3 similar listings nearby','Take 8–10 bright photos (front, rooms, compound, road)','Add the listing here and save','Share the WhatsApp text to 5 groups and your status','Post on Facebook Marketplace, Jiji and PropertyPro','Print the signboard and fix it on the property','Print flyers and drop them at nearby shops and estates','Message every past enquiry and agent contact','Book viewings in 2-hour slots for the same day','Follow up every lead within 1 hour of enquiry','Ask each visitor for a decision date before they leave','Collect the deposit or commitment fee the same day']
let tab='home',edit=null,photo='',mediaFiles=[],kitId=null;
const tabs=[['home','<b>⌂</b>Overview'],['listings','<b>⌂</b>Properties'],['match','<b>⌁</b>Match'],['leads','<b>♙</b>Leads'],['fb','<b>↗</b>Market'],['plan','<b>✓</b>Tasks'],['settings','<b>⚙</b>Settings']];
function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="mediaFiles=[];photo='';tab='${t[0]}';kitId=null;render()">${t[1]}</button>`).join('')}
function render(){document.getElementById('ttl').textContent=S.set.biz||'Vortexedge Property Desk';nav();({home:vHome,listings:vL,leads:vLd,fb:vFb,match:vM,plan:vP,settings:vS})[tab]();hydrateMediaImages();}
const $=id=>document.getElementById(id);
const price=l=>N(l.price,l.currency||S.set.currency)+(l.type=='Rent'?' / '+(l.per||'year'):'');
function stats(){
 const av=S.listings.filter(l=>l.status=='Available').length;
 const open=S.leads.filter(x=>!['Closed – won','Lost'].includes(x.stage)).length;
 const won=S.leads.filter(x=>x.stage=='Closed – won');
 let com={};won.forEach(x=>{const l=S.listings.find(l=>l.id==x.lid);if(l){const c=l.currency||S.set.currency||'NGN';com[c]=(com[c]||0)+l.price*(l.type=='Rent'?S.set.rent:S.set.sale)/100}});const comText=Object.keys(com).length?Object.entries(com).map(([c,v])=>N(v,c)).join(' · '):N(0);
 const due=S.leads.filter(x=>x.fu&&x.fu<=new Date().toISOString().slice(0,10)&&!['Closed – won','Lost'].includes(x.stage)).length;
 return `<div class="st"><div><b>${av}</b><span>Available</span></div><div><b>${open}</b><span>Open leads</span></div><div><b>${due}</b><span>Follow-ups due</span></div><div><b>${allM().length}</b><span>Request matches</span></div><div><b>${won.length}</b><span>Deals closed</span></div><div><b style="font-size:14px">${comText}</b><span>Commission earned (by currency)</span></div></div>`}
function vL(){
 if(kitId)return vKit();
 const e=edit?S.listings.find(l=>l.id==edit):{};
 $('v').innerHTML=stats()+`<div class="c"><h2 style="margin-top:0">Describe a property in plain language</h2><p class="mu">Example: 3-bedroom detached duplex for sale in Lekki Phase 1, Lagos, Nigeria. Asking price USD 450,000. 4 bathrooms, swimming pool and title documents.</p><textarea id="listingPrompt" rows="3" placeholder="Paste or type the property description...">${esc(e.originalPrompt||'')}</textarea><div class="r"><button class="p" onclick="parseListingPrompt()">Extract details into listing</button></div></div><div class="c"><h2 style="margin-top:0">${edit?'Edit listing':'Add listing'}</h2>
 <div class="g">
 <div><label>Title</label><input id="t" value="${esc(e.title)}" placeholder="3-bedroom flat, Sabon Tasha"></div>
 <div><label>For</label><select id="ty"><option ${e.type=='Sale'?'selected':''}>Sale</option><option ${e.type=='Rent'?'selected':''}>Rent</option></select></div>
 <div><label>Property type</label><input id="k" value="${esc(e.kind)}" placeholder="Flat, duplex, land, shop"></div>
 <div><label>City / area / state</label><input id="lo" list="ngStateOptions" value="${esc(e.loc)}" placeholder="Kaduna, Lagos, London, Dubai..."><datalist id="ngStateOptions">${NG_STATES.map(x=>`<option value="${x}">`).join('')}</datalist></div>
 <div><label>Country</label><input id="co" list="countryOptions" value="${esc(e.country||'Nigeria')}" placeholder="Country"><datalist id="countryOptions">${COUNTRIES.map(x=>`<option value="${x}">`).join('')}</datalist></div>
 <div><label>Currency</label><select id="cu" onchange="$('priceCurrency').textContent=this.value">${CURR.map(c=>`<option value="${c}" ${(e.currency||S.set.currency||'NGN')==c?'selected':''}>${c}</option>`).join('')}</select></div>
 <div><label>Price (<span id="priceCurrency">${esc(e.currency||S.set.currency||'NGN')}</span>)</label><input id="pr" type="number" value="${e.price||''}"></div>
 <div><label>Rent period</label><select id="pe"><option ${e.per=='year'?'selected':''}>year</option><option ${e.per=='month'?'selected':''}>month</option></select></div>
 <div><label>Bedrooms</label><input id="bd" type="number" value="${e.beds||''}"></div>
 <div><label>Bathrooms</label><input id="ba" type="number" value="${e.baths||''}"></div>
 <div><label>Status</label><select id="sx">${['Available','Under offer','Closed'].map(s=>`<option ${e.status==s?'selected':''}>${s}</option>`).join('')}</select></div>
 <div><label>Property photos, videos or documents</label><input id="ph" type="file" multiple accept="image/*,video/mp4,video/webm,video/quicktime,video/3gpp,video/x-msvideo,application/pdf" onchange="pickMediaFiles(this)"><div class="mu">Select multiple photos, walkthrough videos or PDF documents. Files upload privately to R2 when connected. One photo can still be saved locally and migrated later.</div></div>
 </div><div style="margin-top:8px"><label>Key features and selling points</label><textarea id="de" rows="3" placeholder="Title document, water, power, security, access road, payment terms">${esc(e.desc)}</textarea></div>
 <div class="r"><button class="p" onclick="saveL()">${edit?'Update':'Save listing'}</button>${edit?'<button onclick="edit=null;photo=\'\';render()">Cancel</button>':''}</div></div>`+
 (S.listings.length?S.listings.map(l=>`<div class="c"><div class="li">${listingPhotoHTML(l)}<div style="flex:1"><b>${esc(l.title)}</b><div><span class="tag">For ${l.type}</span><span class="tag">${esc(l.status)}</span></div><div>${price(l)}</div><div class="mu">${esc(l.loc)}${l.country?', '+esc(l.country):''} ${l.beds?'· '+l.beds+' bed':''} ${l.baths?'· '+l.baths+' bath':''}</div><div class="mu">${S.leads.filter(x=>x.lid==l.id).length} leads · ${matchesFor(l).length} matching requests</div>${listingMediaHTML(l)}</div></div></div>
 <div class="r"><button class="p" onclick="kitId='${l.id}';render()">Marketing kit</button><button onclick="edit='${l.id}';photo='';mediaFiles=[];render();scrollTo(0,0)">Edit</button><button class="d" onclick="delL('${l.id}')">Delete</button></div></div>`).join(''):'<p class="mu">No listings yet. Add your first one above.</p>');
}
function parseListingPrompt(){const raw=$('listingPrompt').value.trim();if(raw.length<12){alert('Enter a fuller property description first.');return}const d=pLst(raw);$('t').value=d.title;$('ty').value=d.tx;$('k').value=d.kind||'';$('lo').value=d.loc||'';$('co').value=d.country||'Nigeria';$('cu').value=d.currency||'NGN';$('pr').value=d.price||'';$('pe').value=d.per||'year';$('bd').value=d.beds||'';$('de').value=raw;if(!d.price)alert('Details extracted. Enter the price manually because it was not detected.');document.getElementById('de').focus()}
function compressImageFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(new Error('Could not read '+file.name));r.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('Could not decode '+file.name));im.onload=()=>{const m=1800,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(new Error('Could not compress '+file.name)),'image/jpeg',.8)};im.src=r.result};r.readAsDataURL(file)})}
function pickMediaFiles(i){const files=Array.from(i.files||[]);if(!files.length)return;if(!ownerKey()){if(files.length===1&&files[0].type.startsWith('image/')){photo='';const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.78)};im.src=r.result};r.readAsDataURL(files[0]);return}alert('Connect to cloud in Settings before attaching multiple files, videos or PDFs.');i.value='';return}mediaFiles=files;photo='';setSt(files.length+' file(s) ready for secure R2 upload')}
function dataUrlBlob(dataUrl){const parts=dataUrl.split(',');const mime=(parts[0].match(/data:([^;]+)/)||[])[1]||'image/jpeg';const binary=atob(parts[1]);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:mime})}
async function cloudMediaUpload(blob,listingId,filename){const key=ownerKey();if(!key)throw new Error('Connect to cloud before uploading property photos.');const url=CLOUD_API+'/media?listingId='+encodeURIComponent(listingId)+'&name='+encodeURIComponent(filename||'property-photo.jpg');const res=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':blob.type||'image/jpeg'},body:blob,cache:'no-store'});let data={};try{data=await res.json()}catch(e){}if(!res.ok)throw new Error(data.error||('Photo upload failed ('+res.status+')'));return data}
const mediaObjectUrls=new Map();
async function mediaObjectUrl(key){if(mediaObjectUrls.has(key))return mediaObjectUrls.get(key);const owner=ownerKey();if(!owner)throw new Error('Connect to cloud to view stored photos.');const res=await fetch(CLOUD_API+'/media/'+encodeURIComponent(key),{headers:{'Authorization':'Bearer '+owner},cache:'no-store'});if(!res.ok)throw new Error(res.status===401?'Cloud access expired. Reconnect in Settings.':'Photo could not be loaded ('+res.status+').');const url=URL.createObjectURL(await res.blob());mediaObjectUrls.set(key,url);return url}
function listingPhotoHTML(l){if(l.photo&&/^data:image\//i.test(l.photo))return `<img src="${l.photo}" alt="Property photo">`;if(l.photoKey)return `<img data-media-key="${esc(l.photoKey)}" alt="Property photo">`;return ''}
function listingMediaHTML(l){const items=Array.isArray(l.media)?l.media:[];const extras=items.filter(m=>m.key&&m.key!==l.photoKey);return extras.length?`<div class="mu" style="margin-top:6px">Files: ${extras.map(m=>`<a href="#" onclick="openMedia(event,'${esc(m.key)}')">${esc(m.name||'Open attachment')}</a>`).join(' · ')}</div>`:''}
async function openMedia(event,key){event.preventDefault();const w=window.open('about:blank','_blank');try{const url=await mediaObjectUrl(key);if(w)w.location=url;else alert('Your browser blocked the new tab. Reopen the attachment after allowing pop-ups.')}catch(e){if(w)w.close();alert(e.message)}}
function hydrateMediaImages(root=document){if(!ownerKey())return;root.querySelectorAll('[data-media-key]').forEach(async img=>{const key=img.getAttribute('data-media-key');if(!key||img.dataset.loading==='1')return;img.dataset.loading='1';try{img.src=await mediaObjectUrl(key)}catch(e){delete img.dataset.loading;img.alt='Photo unavailable — check cloud connection';img.title=e.message}})}
async function migrateListingMediaToR2(){let moved=0;for(const l of S.listings){if(l.photo&&/^data:image\//i.test(l.photo)&&!l.photoKey){setSt('Moving property photos to R2…');const blob=dataUrlBlob(l.photo);const result=await cloudMediaUpload(blob,l.id||'unassigned','property-photo.jpg');l.photoKey=result.key;l.photo='';l.media=Array.isArray(l.media)?l.media:[];l.media.push({key:result.key,name:'property-photo.jpg',type:'image/jpeg',size:blob.size});moved++;cache()}}return moved}

function pLst(b){

 const x=bedsOf(b),k=kindOf(t),tx=rent?'Rent':'Sale';
 return {title:(x?x+'-bedroom ':'')+(k||'property')+(tx=='Rent'?' for rent':' for sale'),tx,loc:areasIn(t),country:countryIn(t),currency:currencyIn(b),kind:k,beds:x,price:amtOf(b),per:/per month|monthly|\/month/.test(t)?'month':'year'}}
function sc(l,r){
 if(l.type!==r.tx||l.status!=='Available')return null;
 const ann=l.type=='Rent'&&l.per=='month'?l.price*12:l.price;
 let p=0,w=0;const why=[];
 const A=(wt,ok,msg)=>{w+=wt;if(ok)p+=wt;why.push((ok?'✓ ':'✗ ')+msg)};
 if(r.country&&l.country&&r.country.toLowerCase()!==l.country.toLowerCase())A(35,false,'Different country');
 else {const ll=(l.loc||'').toLowerCase(),lp=ll.split(/\s*,\s*/).filter(Boolean),ar=(r.loc||'').toLowerCase().split(/\s*,\s*/).filter(Boolean);if(ar.length){const ok=ar.some(a=>ll.includes(a)||lp.some(x=>a.includes(x)));A(35,ok,ok?'Area matches':'Different area')}}
 const rk=kindOf(r.kind)||String(r.kind||'').toLowerCase(),lk=kindOf((l.kind||'')+' '+l.title);
 if(rk&&lk)A(25,lk==rk,lk==rk?'Same property type':'Type differs ('+lk+')');
 if(r.beds&&+l.beds)A(15,+l.beds>=r.beds,+l.beds>=r.beds?l.beds+' beds meets the need':'Only '+l.beds+' beds');
 if(r.budget){if((r.currency||'NGN')!==(l.currency||'NGN'))why.push('Currency differs; budget was not compared');else{const ok=ann<=r.budget,near=!ok&&(ann-r.budget)/r.budget<=.1;A(20,ok,ok?'Within budget':near?'Up to 10% over budget (negotiable)':'Over budget by '+N(ann-r.budget,l.currency||'NGN'));if(near)p+=10}}
 if(!w)return null;
 return {s:Math.min(100,Math.round(p/w*100*Math.min(1,w/55))),why}}
const allM=()=>{const o=[];S.reqs.forEach(r=>S.listings.forEach(l=>{const x=sc(l,r);if(x&&x.s>=mMin)o.push({l,r,s:x.s,why:x.why})}));return o.sort((a,b)=>b.s-a.s)};

function classifyMixed(b){
 const t=String(b||'').toLowerCase();
 const rq=[/looking for|in search of|searching for|seeking|need(?:s)? (?:a |an |one |to rent|to buy)?|client (?:is )?looking|buyer wants|tenant wants|wanted to rent|wanted to buy|requirements?|budget of|my budget|please get me|help me find|urgently (?:need|want)/,/ to rent| for rent| to buy| to purchase/];
 const ls=[/available (?:now|for|at)|for sale|asking price|price is|selling at|property for sale|direct (?:owner|mandate)|inspection (?:is )?available|owner wants|property available|to let/,/bedroom|bedrooms|duplex|bungalow|flat|apartment|plot of land|sqm/];
 const score=a=>a.reduce((n,re)=>n+(re.test(t)?(re===a[0]?3:1):0),0);
 const r=score(rq),l=score(ls);
 if(r===0&&l===0)return 'review';
 if(r>=3&&r>l)return 'request';
 if(l>=3&&l>r)return 'listing';
 if(r>l+1)return 'request';
 if(l>r+1)return 'listing';
 return 'review';
}
function sourceMeta(raw,src){
 const meta={poster:'',phone:'',group:'',profileUrl:'',postUrl:'',postedAt:'',importedAt:Date.now()};
 const wa=/^(\d{1,2}\/\d{1,2}\/\d{2,4}),?\s+(\d{1,2}:\d{2}\s*[AP]M)\s+-\s+([^:]+):\s*([\s\S]*)$/i.exec(raw.trim());
 if(wa){const sender=wa[3].trim();meta.poster=sender;meta.postedAt=(wa[1]+' '+wa[2]).trim();if(/^(?:\+?234|0)[789]\d[\d\s-]{7,12}$/.test(sender))meta.phone=sender;else{const p=(wa[4].match(PH)||[])[0];if(p)meta.phone=p;}}
 else if(/facebook/i.test(src)||/facebook\.com|fb\.com|fb\.watch/i.test(raw)){
  const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(lines.length&&lines[0].length<65&&!/^(search facebook|facebook|public group|about|see more|\d+\s*(hours?|minutes?|days?) ago)/i.test(lines[0]))meta.poster=lines[0];
  const age=raw.match(/\b(?:about an hour|\d+\s+(?:minutes?|hours?|days?|weeks?))\s+ago\b/i);if(age)meta.postedAt=age[0];
  const u=raw.match(/https?:\/\/\S*(?:facebook\.com|fb\.com)\S*/i);if(u)meta.postUrl=u[0].replace(/[),.]+$/,'');
 }
 return meta;
}
function splitWhatsApp(text){
 const re=/(?:^|\n)(\d{1,2}\/\d{1,2}\/\d{2,4}),?\s+\d{1,2}:\d{2}\s*[AP]M\s+-\s+[^:\n]+:\s*/gi;
 const matches=[...text.matchAll(re)];if(matches.length<2)return null;
 return matches.map((m,i)=>text.slice(m.index+m[0].length,matches[i+1]?matches[i+1].index:text.length).trim()).filter(x=>x.length>8).map((body,i)=>matches[i][0].trim().replace(/^\n/, '')+body);
}
function mParse(){
 const rawText=$('mt').value,src=$('ms')?$('ms').value:'';
 const waBlocks=/whatsapp/i.test(src)?splitWhatsApp(rawText):null;
 const bl=(waBlocks||rawText.split(/\n\s*\n|\n-{3,}\n/)).map(s=>s.trim()).filter(s=>s.length>12);
 if(!bl.length){alert('Paste messages first.');return}
 const fbGroup=(rawText.match(/(?:Houses? for rent|Properties? for sale|Real estate)[^\n]{0,90}/i)||[])[0]||'';
 mDraft=bl.map(b=>{
  const sm=sourceMeta(b,src), body=(/^\d{1,2}\/\d{1,2}\/\d{2,4},?\s+\d{1,2}:\d{2}\s*[AP]M\s+-\s+[^:]+:\s*/i.test(b)?b.replace(/^\d{1,2}\/\d{1,2}\/\d{2,4},?\s+\d{1,2}:\d{2}\s*[AP]M\s+-\s+[^:]+:\s*/i,''):b);
  const classification=mMode=='mixed'?classifyMixed(body):(mMode=='req'?'request':'listing');
  const d=classification=='listing'?pLst(body):pReq(body);
  return Object.assign(d,{classification,raw:b,ok:true,src:/facebook\.com|fb\.com|fb\.watch/i.test(b)?'Facebook':src,poster:sm.poster,phone:sm.phone||d.phone,group:fbGroup,profileUrl:sm.profileUrl,postUrl:sm.postUrl,postedAt:sm.postedAt,importedAt:sm.importedAt});
 });
 render();
}

function sc(l,r){
 if(!l||!r||l.type!==r.tx||l.status!=='Available')return null;
 if(l.country&&r.country&&l.country.toLowerCase()!==r.country.toLowerCase())return null;
 const why=[];let earned=0,total=0;
 const add=(weight,score,label)=>{total+=weight;earned+=weight*score;why.push((score>=.75?'✓ ':score>0?'~ ':'✗ ')+label)};
 const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
 const locA=norm(l.loc+' '+l.address),locB=norm(r.loc);
 if(locB){const parts=locB.split(/[ ,]+/).filter(x=>x.length>2);const hit=parts.filter(x=>locA.includes(x)).length;add(28,hit?Math.min(1,hit/Math.min(2,parts.length)):0,hit?'Location overlap':'Area differs')}
 const lk=norm((l.kind||'')+' '+(l.title||'')),rk=norm(r.kind);
 if(rk&&lk){const same=lk.includes(rk)||rk.includes(lk)||(kindOf(lk)&&kindOf(lk)===kindOf(rk));add(15,same?1:0,same?'Property type fits':'Property type differs')}
 if(+r.beds>0&&+l.beds>0)add(9,+l.beds>=+r.beds?1:0,+l.beds+' bedrooms vs '+r.beds+' required');
 if(+r.baths>0&&+l.baths>0)add(5,+l.baths>=+r.baths?1:0,+l.baths+' bathrooms vs '+r.baths+' required');
 if(+r.budget>0&&+l.price>0){const priceYear=l.type==='Rent'&&l.per==='month'?l.price*12:l.price;const budgetYear=r.type==='Rent'&&r.per==='month'?r.budget*12:r.budget;if((r.currency||'NGN')===(l.currency||'NGN')){const ratio=priceYear/budgetYear;add(20,ratio<=1?1:ratio<=1.1?.75:ratio<=1.2?.35:0,ratio<=1?'Within budget':Math.round((ratio-1)*100)+'% over budget')}else why.push('Currency differs; budget not compared')}
 if(+r.propertySize>0&&+l.propertySize>0)add(7,+l.propertySize>=+r.propertySize?1:Math.max(0,+l.propertySize/+r.propertySize),'Building size compared');
 if(+r.parking>0&&+l.parking>0)add(4,+l.parking>=+r.parking?1:0,'Parking spaces compared');
 if(r.furnishing&&l.furnishing)add(4,norm(r.furnishing)===norm(l.furnishing)?1:0,'Furnishing compared');
 if(r.titleDoc&&l.titleDoc)add(4,norm(l.titleDoc).includes(norm(r.titleDoc))?1:0,'Title document compared');
 const need=norm((r.features||'')+' '+(r.raw||'')),have=norm((l.features||'')+' '+(l.desc||''));const tokens=[...new Set(need.split(' ').filter(x=>x.length>3))].filter(x=>have.includes(x));if(tokens.length)add(4,Math.min(1,tokens.length/3),'Feature overlap: '+tokens.slice(0,4).join(', '));
 if(!total)return null;return {s:Math.round(earned/total*100),why};
}

// Expand extraction and matching to include legal title, land size, toilets and amenities.
function featuresOf(t){
 const z=String(t||'').toLowerCase(),known=['swimming pool','gym','bq','boys quarters','generator','borehole','security','fitted kitchen','elevator','lift','garden','solar','inverter','air conditioning','balcony','terrace','gated estate','24-hour power','waterfront','serviced','ensuite','en-suite'];
 return known.filter(x=>z.includes(x)).join(', ');
}
function docOf(t){
 const z=String(t||'').toLowerCase();
 for(const x of ['certificate of occupancy','c of o','right of occupancy','r of o','deed of assignment','governor consent','gazette','excision','freehold','leasehold'])if(z.includes(x))return x;
 return '';
}
function conditionOf(t){
 const z=String(t||'').toLowerCase();
 if(/newly built|brand new/.test(z))return 'Newly built';
 if(/needs? renovation|renovation required|fixer upper/.test(z))return 'Needs renovation';
 if(/excellent condition/.test(z))return 'Excellent';
 if(/good condition/.test(z))return 'Good';
 if(/fair condition/.test(z))return 'Fair';
 return '';
}
function extractPropertyBits(t){const sqm=sqmOf(t),lm=String(t||'').match(/(?:land|plot)[^\r\n.]{0,35}?([\\d,.]+)\\s*(?:sqm|sq\\.?\\s*m|square\\s*met(?:er|re)s?)/i);return {beds:bedsOf(t),baths:bathsOf(t),toilets:toiletsOf(t),parking:parkingOf(t),propertySize:lm?0:sqm,landSize:lm?+lm[1].replace(/,/g,''):0,furnishing:furnishOf(t),features:featuresOf(t),titleDoc:docOf(t),condition:conditionOf(t)}}
function pLst(b){
 const t=String(b||'').toLowerCase(),rent=/\b(for rent|to let|to rent|rental|per annum|per year|yearly|per month|monthly)\b/.test(t),bits=extractPropertyBits(b),k=kindOf(t),tx=rent?'Rent':'Sale';
 return {title:(bits.beds?bits.beds+'-bedroom ':'')+(k||'property')+(rent?' for rent':' for sale'),tx,loc:areasIn(t),country:countryIn(t),currency:currencyIn(b),kind:k,beds:bits.beds,baths:bits.baths,toilets:bits.toilets,parking:bits.parking,price:amtOf(b),per:/per month|monthly|\/month/.test(t)?'month':'year',propertySize:bits.propertySize,landSize:bits.landSize,features:bits.features,titleDoc:bits.titleDoc,condition:bits.condition,furnishing:bits.furnishing};
}
function pReq(b){
 const raw=String(b||''),t=raw.replace(/https?:\/\/\S+/g,' ').toLowerCase(),ph=((raw.match(PH)||[''])[0]).replace(/[\s-]/g,''),bud=amtOf(raw),rent=/\b(rent|rental|to let|lease|tenant|per annum|per year|yearly|monthly|per month)\b/.test(t),buy=/\b(buy|purchase|for sale|selling|sell|invest)\b/.test(t),tx=rent&&!buy?'Rent':buy?'Sale':(bud&&bud<8e6?'Rent':'Sale'),bits=extractPropertyBits(t);
 const um=raw.match(/https?:\/\/(?:www\.|m\.|web\.)?(?:facebook\.com|fb\.com|fb\.watch)\S*/i);let nm=((raw.match(/^\[?[\d\/,.: APMapm-]*\]?\s*-?\s*([A-Z][A-Za-z.' -]{1,28}):\s/)||[])[1]||'').trim();if(/^(budget|location|price|phone|contact|looking|need|wanted)/i.test(nm))nm='';
 let budget=bud;if(tx==='Rent'&&/\b(monthly|per month|a month|\/month)\b/.test(t))budget*=12;
 return {name:nm,phone:ph,url:um?um[0]:'',tx,loc:areasIn(t),country:countryIn(t),currency:currencyIn(raw),kind:kindOf(t),beds:bits.beds,baths:bits.baths,toilets:bits.toilets,propertySize:bits.propertySize,landSize:bits.landSize,parking:bits.parking,furnishing:bits.furnishing,features:bits.features,titleDoc:bits.titleDoc,condition:bits.condition,budget,raw};
}
function sc(l,r){
 if(!l||!r||l.type!==r.tx||l.status!=='Available')return null;
 if(l.country&&r.country&&l.country.toLowerCase()!==r.country.toLowerCase())return null;
 const why=[];let earned=0,total=0;
 const add=(weight,score,label)=>{total+=weight;earned+=weight*score;why.push((score>=.75?'✓ ':score>0?'~ ':'✗ ')+label)};
 const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
 const locA=norm(l.loc+' '+l.address),locB=norm(r.loc);
 if(locB){const parts=locB.split(/[ ,]+/).filter(x=>x.length>2);const hit=parts.filter(x=>locA.includes(x)).length;add(28,hit?Math.min(1,hit/Math.min(2,parts.length)):0,hit?'Location overlap':'Area differs')}
 const lk=norm((l.kind||'')+' '+(l.title||'')),rk=norm(r.kind);
 if(rk&&lk){const same=lk.includes(rk)||rk.includes(lk)||(kindOf(lk)&&kindOf(lk)===kindOf(rk));add(15,same?1:0,same?'Property type fits':'Property type differs')}
 if(+r.beds>0&&+l.beds>0)add(8,+l.beds>=+r.beds?1:0,+l.beds+' bedrooms vs '+r.beds+' required');
 if(+r.baths>0&&+l.baths>0)add(5,+l.baths>=+r.baths?1:0,+l.baths+' bathrooms vs '+r.baths+' required');
 if(+r.toilets>0&&+l.toilets>0)add(3,+l.toilets>=+r.toilets?1:0,'Toilets compared');
 if(+r.budget>0&&+l.price>0){const priceYear=l.type==='Rent'&&l.per==='month'?l.price*12:l.price,budgetYear=r.budget; if((r.currency||'NGN')===(l.currency||'NGN')){const ratio=priceYear/budgetYear;add(20,ratio<=1?1:ratio<=1.1?.75:ratio<=1.2?.35:0,ratio<=1?'Within budget':Math.round((ratio-1)*100)+'% over budget')}else why.push('Currency differs; budget not compared')}
 if(+r.propertySize>0&&+l.propertySize>0)add(5,+l.propertySize>=+r.propertySize?1:Math.max(0,+l.propertySize/+r.propertySize),'Building size compared');
 if(+r.landSize>0&&+l.landSize>0)add(6,+l.landSize>=+r.landSize?1:Math.max(0,+l.landSize/+r.landSize),'Land size compared');
 if(+r.parking>0&&+l.parking>0)add(3,+l.parking>=+r.parking?1:0,'Parking spaces compared');
 if(r.furnishing&&l.furnishing)add(3,norm(r.furnishing)===norm(l.furnishing)?1:0,'Furnishing compared');
 if(r.condition&&l.condition)add(2,norm(r.condition)===norm(l.condition)?1:0,'Condition compared');
 if(r.titleDoc&&l.titleDoc)add(5,norm(l.titleDoc).includes(norm(r.titleDoc))?1:0,'Title document compared');
 const stop=new Set(['looking','property','need','want','rent','sale','buy','for','with','around','near','please','client','budget','house','apartment','from','that','this','have','has','the','and','you','any','area','must','should']);
 const need=norm((r.features||'')+' '+(r.raw||'')),have=norm((l.features||'')+' '+(l.desc||''));const tokens=[...new Set(need.split(' ').filter(x=>x.length>3&&!stop.has(x)))].filter(x=>have.includes(x));if(tokens.length)add(7,Math.min(1,tokens.length/3),'Feature overlap: '+tokens.slice(0,4).join(', '));
 if(!total)return null;return {s:Math.round(earned/total*100*Math.min(1,total/55)),why};
}
