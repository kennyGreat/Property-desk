<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Property Desk</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f6b4f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e2e0d8;--ac:#0f6b4f;--ac2:#e8f3ee;--wa:#1f9d55;--rd:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151614;--card:#1f211e;--tx:#ecebe6;--mu:#9a988f;--bd:#33362f;--ac:#3fb98a;--ac2:#203a30;--wa:#3fb98a;--rd:#ff8a80}}
:root[data-theme="dark"]{--bg:#151614;--card:#1f211e;--tx:#ecebe6;--mu:#9a988f;--bd:#33362f;--ac:#3fb98a;--ac2:#203a30;--wa:#3fb98a;--rd:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:16px;margin:14px 0 8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-width:0;border:0;background:none;padding:6px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;font-weight:400}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
button.d{color:var(--rd)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.st div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.st b{display:block;font-size:20px}.st span{font-size:12px;color:var(--mu)}
.r{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin-right:4px}
.li{display:flex;gap:10px}.li img{width:84px;height:84px;object-fit:cover;border-radius:8px}
.hide{display:none}a.btn{display:inline-block;text-decoration:none;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;color:var(--tx)}
#pa{display:none}
@media print{body>.w{display:none}#pa{display:block;color:#000;background:#fff}}
#auth{position:fixed;inset:0;background:var(--bg);z-index:50;padding:12px;overflow:auto;display:none}
.w{padding-bottom:96px}
input,select,textarea{font-size:16px}button,a.btn{min-height:40px}
nav button{position:relative}
</style></head><body>
<div class="w">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1 id="ttl">Property Desk</h1><span id="sy" class="mu" style="font-size:12px;text-align:right"></span></div>
<nav id="nav"></nav>
<div id="v"></div>
</div>
<div id="pa"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const K='propdesk_v1';
let S={listings:[],leads:[],set:{biz:'Vortexedge Real Estate',phone:'',sale:5,rent:10},chk:{},groups:[],reqs:[]};
try{const x=localStorage.getItem(K);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const cache=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};const save=()=>{cache();qsync()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=n=>'₦'+Number(n||0).toLocaleString('en-NG');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const wa=p=>{p=String(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='234'+p.slice(1);return p};
const STG=['New','Contacted','Viewing booked','Offer made','Closed – won','Lost'];
const SRC=['WhatsApp','Signboard','Walk-in','Facebook','Instagram','Referral','Jiji/PropertyPro','Other'];
const PLAN=['Confirm price against 3 similar listings nearby','Take 8–10 bright photos (front, rooms, compound, road)','Add the listing here and save','Share the WhatsApp text to 5 groups and your status','Post on Facebook Marketplace, Jiji and PropertyPro','Print the signboard and fix it on the property','Print flyers and drop them at nearby shops and estates','Message every past enquiry and agent contact','Book viewings in 2-hour slots for the same day','Follow up every lead within 1 hour of enquiry','Ask each visitor for a decision date before they leave','Collect the deposit or commitment fee the same day']
let tab='listings',edit=null,photo='',kitId=null;
const tabs=[['listings','<b>🏠</b>Listings'],['match','<b>🔗</b>Match'],['leads','<b>👥</b>Leads'],['fb','<b>📘</b>Facebook'],['plan','<b>✅</b>Plan'],['settings','<b>⚙️</b>Settings']];
function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';kitId=null;render()">${t[1]}${t[0]=='match'&&INB.length?'<span class="tag" style="position:absolute;margin:-3px 0 0 16px">'+INB.length+'</span>':''}</button>`).join('')}
function render(){document.getElementById('ttl').textContent=S.set.biz||'Property Desk';nav();({listings:vL,leads:vLd,fb:vFb,match:vM,plan:vP,settings:vS})[tab]();}
const $=id=>document.getElementById(id);
const price=l=>N(l.price)+(l.type=='Rent'?' / '+(l.per||'year'):'');
function stats(){
 const av=S.listings.filter(l=>l.status=='Available').length;
 const open=S.leads.filter(x=>!['Closed – won','Lost'].includes(x.stage)).length;
 const won=S.leads.filter(x=>x.stage=='Closed – won');
 let com=0;won.forEach(x=>{const l=S.listings.find(l=>l.id==x.lid);if(l)com+=l.price*(l.type=='Rent'?S.set.rent:S.set.sale)/100});
 const due=S.leads.filter(x=>x.fu&&x.fu<=new Date().toISOString().slice(0,10)&&!['Closed – won','Lost'].includes(x.stage)).length;
 return `<div class="st"><div><b>${av}</b><span>Available</span></div><div><b>${open}</b><span>Open leads</span></div><div><b>${due}</b><span>Follow-ups due</span></div><div><b>${allM().length}</b><span>Request matches</span></div><div><b>${won.length}</b><span>Deals closed</span></div><div><b>${N(com)}</b><span>Commission earned</span></div></div>`}
function vL(){
 if(kitId)return vKit();
 const e=edit?S.listings.find(l=>l.id==edit):{};
 $('v').innerHTML=stats()+`<div class="c"><h2 style="margin-top:0">${edit?'Edit listing':'Add listing'}</h2>
 <div class="g">
 <div><label>Title</label><input id="t" value="${esc(e.title)}" placeholder="3-bedroom flat, Sabon Tasha"></div>
 <div><label>For</label><select id="ty"><option ${e.type=='Sale'?'selected':''}>Sale</option><option ${e.type=='Rent'?'selected':''}>Rent</option></select></div>
 <div><label>Property type</label><input id="k" value="${esc(e.kind)}" placeholder="Flat, duplex, land, shop"></div>
 <div><label>Location</label><input id="lo" value="${esc(e.loc)}" placeholder="Area, city"></div>
 <div><label>Price (₦)</label><input id="pr" type="number" value="${e.price||''}"></div>
 <div><label>Rent period</label><select id="pe"><option ${e.per=='year'?'selected':''}>year</option><option ${e.per=='month'?'selected':''}>month</option></select></div>
 <div><label>Bedrooms</label><input id="bd" type="number" value="${e.beds||''}"></div>
 <div><label>Bathrooms</label><input id="ba" type="number" value="${e.baths||''}"></div>
 <div><label>Status</label><select id="sx">${['Available','Under offer','Closed'].map(s=>`<option ${e.status==s?'selected':''}>${s}</option>`).join('')}</select></div>
 <div><label>Photo</label><input id="ph" type="file" accept="image/*" onchange="pick(this)"></div>
 </div><div style="margin-top:8px"><label>Key features and selling points</label><textarea id="de" rows="3" placeholder="Title document, water, power, security, access road, payment terms">${esc(e.desc)}</textarea></div>
 <div class="r"><button class="p" onclick="saveL()">${edit?'Update':'Save listing'}</button>${edit?'<button onclick="edit=null;photo=\'\';render()">Cancel</button>':''}</div></div>`+
 (S.listings.length?S.listings.map(l=>`<div class="c"><div class="li">${l.photo?`<img src="${l.photo}" alt="">`:''}<div style="flex:1"><b>${esc(l.title)}</b><div><span class="tag">For ${l.type}</span><span class="tag">${esc(l.status)}</span></div><div>${price(l)}</div><div class="mu">${esc(l.loc)} ${l.beds?'· '+l.beds+' bed':''} ${l.baths?'· '+l.baths+' bath':''}</div><div class="mu">${S.leads.filter(x=>x.lid==l.id).length} leads · ${matchesFor(l).length} matching requests</div></div></div>
 <div class="r"><button class="p" onclick="kitId='${l.id}';render()">Marketing kit</button><button onclick="edit='${l.id}';photo='';render();scrollTo(0,0)">Edit</button><button class="d" onclick="delL('${l.id}')">Delete</button></div></div>`).join(''):'<p class="mu">No listings yet. Add your first one above.</p>');
}
function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)}
function saveL(){
 const o={title:$('t').value.trim(),type:$('ty').value,kind:$('k').value,loc:$('lo').value,price:+$('pr').value,per:$('pe').value,beds:$('bd').value,baths:$('ba').value,status:$('sx').value,desc:$('de').value};
 if(!o.title||!o.price){alert('Add a title and a price.');return}
 if(edit){const l=S.listings.find(l=>l.id==edit);Object.assign(l,o);if(photo)l.photo=photo}else S.listings.unshift(Object.assign({id:uid(),photo},o));
 edit=null;photo='';save();render()}
function delL(id){if(confirm('Delete this listing?')){S.listings=S.listings.filter(l=>l.id!=id);save();render()}}
function txt(l){const s=S.set;return `🏠 *FOR ${l.type.toUpperCase()}*\n*${l.title}*\n📍 ${l.loc||''}\n💰 ${price(l)}${l.beds?`\n🛏 ${l.beds} bed`:''}${l.baths?` · 🚿 ${l.baths} bath`:''}${l.desc?'\n\n'+l.desc:''}\n\n📞 ${s.biz}${s.phone?'\nCall/WhatsApp: '+s.phone:''}\nViewing available. Message now to book.`}
function vKit(){
 const l=S.listings.find(l=>l.id==kitId);if(!l){kitId=null;return render()}
 const link=`https://wa.me/${wa(S.set.phone)}?text=${encodeURIComponent('Hi, I am interested in: '+l.title)}`;
 $('v').innerHTML=`<button onclick="kitId=null;render()">← Back</button><div class="c" style="margin-top:10px"><b>${esc(l.title)}</b> <span class="mu">${price(l)}</span>
 ${S.set.phone?'':'<p class="mu" style="color:var(--rd)">Add your phone number in Settings so flyers, signboards and the QR code carry it.</p>'}
 <h2>WhatsApp and social post</h2><textarea id="kt" rows="9">${esc(txt(l))}</textarea>
 <div class="r"><button class="p" onclick="navigator.clipboard.writeText($('kt').value).then(()=>this.textContent='Copied')">Copy text</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt(l))}">Share on WhatsApp</a></div>
 <h2>Offline materials</h2><div class="r"><button onclick="printFlyer('${l.id}')">Print flyer</button><button onclick="printSign('${l.id}')">Print signboard (A4)</button></div>
 ${kitMatches(l)}<h2>Enquiry QR code</h2><p class="mu">Anyone who scans it opens WhatsApp with your listing already typed.</p><div id="qr" style="background:#fff;display:inline-block;padding:8px"></div></div>`;
 try{new QRCode($('qr'),{text:link,width:160,height:160})}catch(e){$('qr').textContent='QR code could not load (check your connection).'}}
function qrImg(l){const d=document.createElement('div');try{new QRCode(d,{text:`https://wa.me/${wa(S.set.phone)}?text=${encodeURIComponent('Hi, I am interested in: '+l.title)}`,width:150,height:150})}catch(e){}return d.innerHTML}
function printFlyer(id){const l=S.listings.find(l=>l.id==id);
 $('pa').innerHTML=`<div style="font-family:Arial,sans-serif;padding:20px;text-align:center"><div style="background:#0f6b4f;color:#fff;font-size:34px;font-weight:700;padding:10px">FOR ${l.type.toUpperCase()}</div>${l.photo?`<img src="${l.photo}" style="width:100%;max-height:420px;object-fit:cover;margin-top:12px">`:''}<h1 style="font-size:30px;margin:12px 0 4px">${esc(l.title)}</h1><div style="font-size:18px">${esc(l.loc)}</div><div style="font-size:32px;font-weight:700;margin:8px 0">${price(l)}</div><div style="font-size:18px">${l.beds?l.beds+' bed':''} ${l.baths?'· '+l.baths+' bath':''}</div><p style="font-size:16px;white-space:pre-wrap">${esc(l.desc)}</p><div style="display:flex;justify-content:center;align-items:center;gap:20px;margin-top:10px">${qrImg(l)}<div style="font-size:22px;font-weight:700">${esc(S.set.biz)}<br>${esc(S.set.phone)}</div></div></div>`;setTimeout(()=>print(),300)}
function printSign(id){const l=S.listings.find(l=>l.id==id);
 $('pa').innerHTML=`<div style="font-family:Arial,sans-serif;text-align:center;padding:30px;border:12px solid #0f6b4f;min-height:90vh"><div style="font-size:110px;font-weight:900;line-height:1">FOR<br>${l.type.toUpperCase()}</div><div style="font-size:40px;margin:24px 0">${esc(l.kind||'')} ${l.beds?'· '+l.beds+' bed':''}</div><div style="font-size:70px;font-weight:800;color:#0f6b4f">${esc(S.set.phone||'Add phone in Settings')}</div><div style="font-size:34px;margin-top:20px">${esc(S.set.biz)}</div><div style="margin-top:20px">${qrImg(l)}</div></div>`;setTimeout(()=>print(),300)}
function vLd(){
 const td=new Date().toISOString().slice(0,10);
 $('v').innerHTML=`<div class="c"><h2 style="margin-top:0">Log an enquiry</h2><div class="g">
 <div><label>Name</label><input id="ln"></div><div><label>Phone</label><input id="lp" type="tel"></div>
 <div><label>Listing</label><select id="ll"><option value="">General</option>${S.listings.map(l=>`<option value="${l.id}">${esc(l.title)}</option>`).join('')}</select></div>
 <div><label>Source</label><select id="ls">${SRC.map(s=>`<option>${s}</option>`).join('')}</select></div>
 <div><label>Follow up on</label><input id="lf" type="date" value="${td}"></div></div>
 <div style="margin-top:8px"><label>Note</label><input id="lt" placeholder="Budget, preferred viewing time, concerns"></div>
 <div class="r"><button class="p" onclick="addLead()">Save lead</button></div></div>`+
 (S.leads.length?S.leads.map(x=>{const l=S.listings.find(l=>l.id==x.lid);const due=x.fu&&x.fu<=td&&!['Closed – won','Lost'].includes(x.stage);return `<div class="c"><b>${esc(x.name)}</b> <span class="tag">${esc(x.src)}</span>${due?'<span class="tag" style="background:#fde7e5;color:var(--rd)">Follow up now</span>':''}<div class="mu">${esc(x.phone)} · ${l?esc(l.title):'General'}${x.fu?' · follow up '+x.fu:''}</div><div>${esc(x.note)}</div>
 <div class="r"><select style="width:auto" onchange="setStage('${x.id}',this.value)">${STG.map(s=>`<option ${x.stage==s?'selected':''}>${s}</option>`).join('')}</select><a class="btn" ${x.phone?'':'style="display:none"'} href="tel:${esc(x.phone)}">Call</a><a class="btn" ${x.phone?'':'style="display:none"'} target="_blank" rel="noopener" href="https://wa.me/${wa(x.phone)}?text=${encodeURIComponent('Hello '+x.name+', following up on '+(l?l.title:'your property enquiry')+'. Are you free to view today?')}">WhatsApp</a>${x.url?`<a class="btn" target="_blank" rel="noopener" href="${esc(x.url)}">Facebook</a>`:''}${x.rid?`<button onclick="tab='match';render()">Matches</button>`:''}<button class="d" onclick="delLd('${x.id}')">Delete</button></div></div>`}).join(''):'<p class="mu">No leads yet.</p>');}
function addLead(){const n=$('ln').value.trim();if(!n||!$('lp').value.trim()){alert('Name and phone are required.');return}
 S.leads.unshift({id:uid(),name:n,phone:$('lp').value.trim(),lid:$('ll').value,src:$('ls').value,fu:$('lf').value,note:$('lt').value,stage:'New'});save();render()}
function setStage(id,s){const x=S.leads.find(x=>x.id==id);x.stage=s;if(s=='Closed – won'){const l=S.listings.find(l=>l.id==x.lid);if(l&&confirm('Mark "'+l.title+'" as Closed?'))l.status='Closed'}save();render()}
function delLd(id){if(confirm('Delete this lead?')){S.leads=S.leads.filter(x=>x.id!=id);save();render()}}
function vP(){$('v').innerHTML=`<div class="c"><h2 style="margin-top:0">24-hour push</h2><p class="mu">Work through these in order. Speed of response and same-day viewings drive results.</p>${PLAN.map((p,i)=>`<label style="display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--tx);padding:6px 0"><input type="checkbox" style="width:auto;margin-top:4px" ${S.chk[i]?'checked':''} onchange="S.chk[${i}]=this.checked;save()"> ${p}</label>`).join('')}<div class="r"><button onclick="S.chk={};save();render()">Reset</button></div></div>`}
function vS(){const s=S.set;$('v').innerHTML=`<div class="c"><h2 style="margin-top:0">Your details</h2><div class="g"><div><label>Business name</label><input id="sb" value="${esc(s.biz)}"></div><div><label>Phone / WhatsApp</label><input id="sp" value="${esc(s.phone)}" placeholder="08012345678"></div><div><label>Sale commission %</label><input id="ss" type="number" value="${s.sale}"></div><div><label>Rent commission %</label><input id="sr" type="number" value="${s.rent}"></div></div><div class="r"><button class="p" onclick="saveS()">Save</button></div></div>
 ${acctCard()}${capCard()}<div class="c"><h2 style="margin-top:0">Backup</h2><p class="mu">Data lives in this browser only. Export regularly.</p><div class="r"><button onclick="exp()">Export backup</button><button onclick="$('imf').click()">Import backup</button><input id="imf" type="file" accept=".json" class="hide" onchange="imp(this)"></div></div>`}
function saveS(){S.set={biz:$('sb').value,phone:$('sp').value,sale:+$('ss').value,rent:+$('sr').value};save();render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='property-desk-backup.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();render()}catch(e){alert('Invalid file')}};r.readAsText(f)}
let fbL='';
const fbq=q=>'https://www.facebook.com/search/posts/?q='+encodeURIComponent(q);
function fbVar(l,i){const s=S.set,a=l.loc||'town';
 if(i==1)return `${l.type=='Rent'?'🔑 Available to rent':'🏡 Available for sale'} in ${a}\n${l.title}\n${price(l)}\n${l.desc||''}\nInbox or call ${s.phone||''} – ${s.biz}`;
 if(i==2)return `Anyone looking for ${l.kind||'a property'} ${l.type=='Rent'?'to rent':'to buy'} around ${a}? I have ${l.title} at ${price(l)}. ${l.desc?l.desc+' ':''}Comment or message me. ${s.biz} ${s.phone||''}`;
 return txt(l)}
function vFb(){
 const ls=S.listings;if(!ls.find(l=>l.id==fbL))fbL=ls[0]&&ls[0].id;const l=ls.find(l=>l.id==fbL);
 if(!l){$('v').innerHTML='<div class="c">Add a listing first. The Facebook tools build their searches and posts from it.</div>';return}
 const a=l.loc||'',b=l.beds?l.beds+' bedroom':(l.kind||'property');
 const qs=l.type=='Rent'?[`"looking for" ${b} ${a}`,`"need a" ${b} to rent ${a}`,`"please I need" apartment ${a}`,`"house to rent" ${a}`,`"relocating to" ${a}`]:[`"looking to buy" ${b} ${a}`,`"want to buy" ${l.kind||'property'} ${a}`,`"anyone selling" ${l.kind||'land'} ${a}`,`"investors" ${a} property`];
 const now=Date.now();
 $('v').innerHTML=`<div class="c"><label>Listing to promote</label><select onchange="fbL=this.value;render()">${ls.map(x=>`<option value="${x.id}" ${x.id==fbL?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>
 <div class="c"><h2 style="margin-top:0">1. Find prospects</h2><p class="mu">Opens Facebook’s own search for people asking for what you have. Log in to Facebook first. Reply with a helpful comment or message them, and don’t spam.</p>
 <div class="r">${qs.map(q=>`<a class="btn" target="_blank" rel="noopener" href="${fbq(q)}">${esc(q)}</a>`).join('')}</div>
 <div class="r"><input id="cq" placeholder="Your own search phrase" style="flex:1;min-width:180px"><button class="p" onclick="if($('cq').value)window.open(fbq($('cq').value),'_blank')">Search</button></div>
 <div class="r"><a class="btn" target="_blank" rel="noopener" href="https://www.facebook.com/search/groups/?q=${encodeURIComponent('real estate '+a)}">Find local property groups</a><a class="btn" target="_blank" rel="noopener" href="https://www.facebook.com/marketplace/search/?query=${encodeURIComponent(l.kind||'property')+' '+encodeURIComponent(a)}">Check Marketplace competition</a></div></div>

const ORD={desk_listings:'order=created_at.desc',desk_requests:'order=created_at.desc',desk_leads:'order=created_at.desc',desk_groups:'order=created_at.asc',desk_settings:''};
const NUMC=new Set(['price','beds','baths','budget']),ZERO=new Set(['at','n','last']);
const blank=()=>({listings:[],leads:[],set:{biz:'Vortexedge Real Estate',phone:'',sale:5,rent:10},chk:{},groups:[],reqs:[]});
let sess=null,snap={},busy=false,dirty=false,st='',dip=null,tmr=0;
try{sess=JSON.parse(localStorage.getItem('pd_sess'));snap=JSON.parse(localStorage.getItem('pd_snap'))||{}}catch(e){}
const setSt=m=>{st=m;['sy','sy2'].forEach(i=>{const e=document.getElementById(i);if(e)e.textContent=m})};
const qsync=()=>{clearTimeout(tmr);tmr=setTimeout(sync,500)};
function setSess(j){sess={access_token:j.access_token,refresh_token:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:(j.user&&j.user.id)||(sess&&sess.uid),email:(j.user&&j.user.email)||(sess&&sess.email)};localStorage.setItem('pd_sess',JSON.stringify(sess))}
async function token(){
 if(!sess)return null;
 if(sess.exp-Date.now()/1000<90){
  const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sess.refresh_token})});
  if(r.status==400||r.status==401){signOut();return null}
  if(!r.ok)throw new Error('offline');
  setSess(await r.json())}
 return sess.access_token}
async function api(path,o={}){
 const t=await token();if(!t)throw new Error('auth');
 const r=await fetch(SB+path,Object.assign({},o,{headers:Object.assign({apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},o.headers||{})}));
 if(!r.ok)throw new Error(path.split('?')[0]+' '+r.status+' '+(await r.text()).slice(0,150));
 return r.status==204?null:r.json().catch(()=>null)}
function toRow(t,it){const o={};
 for(const c of COL[t]){let v=it[c];
  if(NUMC.has(c)||ZERO.has(c)){v=(v===''||v==null||isNaN(+v))?null:+v;if((c=='beds'||c=='baths')&&v!=null)v=Math.round(v);if(v==null&&(c=='price'||ZERO.has(c)))v=0}
  else if(c=='lead')v=!!v;
  else if(c=='fu')v=v||null;
  else v=v==null?'':String(v);
  o[c]=v}
 return o}
function fromRow(t,r){const o={};for(const c of COL[t]){let v=r[c];if(v==null)v=ZERO.has(c)?0:c=='lead'?false:'';o[c]=v}return o}
const setObj=()=>({user_id:sess.uid,biz:S.set.biz||'',phone:S.set.phone||'',sale_comm:+S.set.sale||0,rent_comm:+S.set.rent||0,checks:S.chk||{}});
function rowsNow(){const o={};for(const t in COL){S[MAP[t]].forEach(it=>{if(!it.id)it.id=uid()});o[t]=new Map(S[MAP[t]].map(it=>[it.id,toRow(t,it)]))}return o}
async function upPhoto(d){
 const b=await (await fetch(d)).blob(),p=sess.uid+'/'+Date.now()+'.jpg',t=await token();
 const r=await fetch(SB+'/storage/v1/object/desk-photos/'+p,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'image/jpeg'},body:b});
 if(!r.ok)throw new Error('photo '+r.status);
 return SB+'/storage/v1/object/public/desk-photos/'+p}
async function sync(){
 if(!sess)return;if(busy){dirty=true;return}
 busy=true;dirty=false;setSt('Syncing…');
 try{
  for(const l of S.listings)if(String(l.photo||'').startsWith('data:')){l.photo=await upPhoto(l.photo);cache()}
  const now=rowsNow();
  for(const t in COL){
   const old=snap[t]||{},up=[],del=[];
   now[t].forEach((r,id)=>{if(JSON.stringify(r)!==old[id])up.push(r)});
   Object.keys(old).forEach(id=>{if(!now[t].has(id))del.push(id)});
   if(up.length)await api('/rest/v1/'+t+'?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(up)});
   if(del.length)await api('/rest/v1/'+t+'?id=in.('+del.map(i=>'"'+i+'"').join(',')+')',{method:'DELETE'});
   snap[t]={};now[t].forEach((r,id)=>{snap[t][id]=JSON.stringify(r)})}
  const sj=JSON.stringify(setObj());
  if(snap.set!==sj){await api('/rest/v1/desk_settings?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:sj});snap.set=sj}
  setSt('✓ Saved')
 }catch(e){setSt(e.message=='auth'?'Sign in again':'⚠ Offline: saved on phone, will sync');console.warn(e)}
 finally{try{localStorage.setItem('pd_snap',JSON.stringify(snap))}catch(e){}busy=false}
 if(dirty)sync()}
async function pull(){
 const res={};
 await Promise.all(Object.keys(ORD).map(async t=>{res[t]=await api('/rest/v1/'+t+'?select=*'+(ORD[t]?'&'+ORD[t]:''))}));
 for(const t in COL)S[MAP[t]]=(res[t]||[]).map(r=>fromRow(t,r));
 const s=(res.desk_settings||[])[0];
 if(s){S.set={biz:s.biz||'',phone:s.phone||'',sale:s.sale_comm,rent:s.rent_comm};S.chk=s.checks||{}}
 const now=rowsNow();snap={};for(const t in COL){snap[t]={};now[t].forEach((r,id)=>{snap[t][id]=JSON.stringify(r)})}
 if(s)snap.set=JSON.stringify(setObj());
 localStorage.setItem('pd_snap',JSON.stringify(snap))}
async function boot(){
 hideAuth();
 if(localStorage.getItem('pd_uid')!==sess.uid){S=blank();snap={};localStorage.setItem('pd_uid',sess.uid)}
 render();
 try{await sync();await pull();await loadInb();cache();render();setSt('✓ Synced')}catch(e){setSt('⚠ Offline: showing saved data')}}
async function syncNow(){await sync();try{await pull();cache();render();setSt('✓ Synced')}catch(e){setSt('⚠ Offline: showing saved data')}}
function signOut(){INB=[];cap=null;sess=null;snap={};['pd_sess','pd_snap','pd_uid',K].forEach(k=>localStorage.removeItem(k));S=blank();render();showAuth()}
function hideAuth(){const a=document.getElementById('auth');if(a)a.style.display='none'}
function showAuth(m){
 let a=document.getElementById('auth');
 if(!a){document.body.insertAdjacentHTML('beforeend','<div id="auth"><div class="c" style="max-width:380px;margin:10vh auto 0"><h1>Property Desk</h1><p class="mu">Sign in to open your listings, requests and leads on any device.</p><label>Email</label><input id="ae" type="email" autocomplete="username"><label style="margin-top:8px">Password</label><input id="ap" type="password" autocomplete="current-password"><p id="am" class="mu" style="min-height:20px"></p><div class="r"><button class="p" onclick="doAuth(false)">Sign in</button><button onclick="doAuth(true)">Create account</button></div></div></div>');a=document.getElementById('auth')}
 a.style.display='block';if(m)document.getElementById('am').textContent=m}
async function doAuth(up){
 const e=$('ae').value.trim(),p=$('ap').value,m=$('am');
 if(!e||p.length<6){m.textContent='Enter your email and a password of at least 6 characters.';return}
 m.textContent='Please wait…';
 try{
  const r=await fetch(SB+(up?'/auth/v1/signup':'/auth/v1/token?grant_type=password'),{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){m.textContent=j.msg||j.error_description||j.message||'Could not sign in.';return}
  if(!j.access_token){m.textContent='Account created. Check your email to confirm it, then sign in.';return}
  setSess(j);boot()
 }catch(x){m.textContent='No connection. Connect to the internet to sign in.'}}
function acctCard(){return `<div class="c"><h2 style="margin-top:0">Account and sync</h2><p class="mu">${esc(sess&&sess.email||'')}<br><span id="sy2">${esc(st)}</span></p><div class="r"><button class="p" onclick="syncNow()">Sync now</button>${dip?'<button onclick="dip.prompt();dip=null;render()">Install on phone</button>':''}<button class="d" onclick="if(confirm(\'Sign out of this phone?\'))signOut()">Sign out</button></div></div>`}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});
addEventListener('online',()=>sync());
setInterval(()=>{if(sess&&navigator.onLine&&!busy)sync()},30000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ===== Phone notification inbox ===== */
let INB=[],cap=null;
const appSrc=a=>/whatsapp/i.test(a)?'WhatsApp':/facebook|messenger|fb/i.test(a)?'Facebook':'Other';
function inbHTML(){
 if(!INB.length)return '';
 return `<div class="c"><h2 style="margin-top:0">Captured from your phone (${INB.length})</h2><p class="mu">Property messages and notifications forwarded from your phone. Check each one before it goes in.</p>`+
 INB.slice(0,20).map(n=>`<div class="c" style="margin:8px 0 0"><div class="mu">${esc(n.app||'App')} · ${esc(new Date(n.received_at).toLocaleString('en-NG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}))}</div><div>${n.title?'<b>'+esc(n.title)+'</b><br>':''}${esc((n.body||'').slice(0,300))}</div><div class="r"><button class="p" onclick="inbAdd(['${n.id}'],'req')">Add as request</button><button onclick="inbAdd(['${n.id}'],'lst')">Add as listing</button><button class="d" onclick="inbSet(['${n.id}'],'dismissed')">Dismiss</button></div></div>`).join('')+
 `<div class="r"><button class="p" onclick="inbAdd(INB.slice(0,20).map(n=>n.id),'req')">Add all as requests</button><button onclick="if(confirm('Dismiss all captured items?'))inbSet(INB.map(n=>n.id),'dismissed')">Dismiss all</button></div></div>`}
function drawInb(){const e=document.getElementById('inb');if(e)e.innerHTML=inbHTML();nav()}
async function loadInb(){try{INB=(await api('/rest/v1/desk_inbox?select=*&status=eq.new&order=received_at.desc&limit=100'))||[];const c=await api('/rest/v1/desk_ingest?select=token');cap=c&&c[0]?c[0].token:null;drawInb()}catch(e){}}
async function inbSet(ids,status){
 if(!ids.length)return;
 try{await api('/rest/v1/desk_inbox?id=in.('+ids.join(',')+')',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status})})}catch(e){return}
 INB=INB.filter(n=>!ids.includes(n.id));drawInb()}
const markInb=ids=>inbSet(ids,'imported');
function inbAdd(ids,k){
 const items=INB.filter(n=>ids.includes(n.id));if(!items.length)return;
 mMode=k;tab='match';
 mDraft=items.map(n=>{const raw=(n.title?n.title+': ':'')+(n.body||'');
  return Object.assign(k=='req'?pReq(raw):pLst(raw),{raw,ok:true,inboxId:n.id,src:appSrc(n.app)})});
 render()}
async function capNew(){
 const a=new Uint8Array(32);crypto.getRandomValues(a);const t=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');
 try{await api('/rest/v1/desk_ingest?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:sess.uid,token:t})});cap=t;render()}
 catch(e){alert('Could not create the key. Check your connection and try again.')}}
function capCard(){
 const u=SB+'/functions/v1/ingest';
 return `<div class="c"><h2 style="margin-top:0">Capture phone notifications</h2><p class="mu">Forward property messages and notifications from WhatsApp, Facebook and other apps into your Inbox. One-time setup of about 10 minutes in MacroDroid or Tasker.</p>`+
 (cap?`<label>Address (POST)</label><input readonly value="${u}" onclick="this.select()"><label style="margin-top:8px">Capture key (keep private)</label><input readonly value="${esc(cap)}" onclick="this.select()"><div class="r"><button onclick="navigator.clipboard.writeText('${u}')">Copy address</button><button onclick="navigator.clipboard.writeText(cap)">Copy key</button><button class="d" onclick="if(confirm('Make a new key? The old one stops working.'))capNew()">New key</button></div>
 <details style="margin-top:10px"><summary>Setup steps</summary><ol class="mu" style="padding-left:18px"><li>Install MacroDroid (or Tasker) and allow Notification access when it asks.</li><li>New macro, trigger: Notification Received. Pick WhatsApp, WhatsApp Business, Facebook, Messenger and any property apps you use. Leave out banking and OTP apps.</li><li>Action: HTTP Request, method POST, URL = the address above.</li><li>Add a header named x-capture-key with your key, and set the content type to JSON.</li><li>Body: {"app":"APP","title":"TITLE","text":"TEXT"}. Replace APP, TITLE and TEXT with MacroDroid's notification app name, title and text variables from its magic-text list.</li><li>Save, then turn off battery optimisation for MacroDroid so it keeps running.</li></ol><p class="mu">Only property-related messages are kept. Everything else is discarded without being stored.</p></details>`
 :`<div class="r"><button class="p" onclick="capNew()">Create capture key</button></div>`)+'</div>'}
addEventListener('visibilitychange',()=>{if(!document.hidden&&sess&&navigator.onLine)loadInb()});
setInterval(()=>{if(sess&&navigator.onLine)loadInb()},30000);

if(sess)boot();else{render();showAuth()}
</script></body></html>
