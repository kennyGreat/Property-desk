<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Property Desk</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f6b4f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e2e0d8;--ac:#0f6b4f;--ac2:#e8f3ee;--wa:#1f9d55;--rd:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151614;--card:#1f211e;--tx:#ecebe6;--mu:#9a988f;--bd:#33362f;--ac:#3fb98a;--ac2:#203a30;--wa:#3fb98a;--rd:#ff8a80}}
:root[data-theme="dark"]{--bg:#151614;--card:#1f211e;--tx:#ecebe6;--mu:#9a988f;--bd:#33362f;--ac:#3fb98a;--ac2:#203a30;--wa:#3fb98a;--rd:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:16px;margin:14px 0 8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-width:0;border:0;background:none;padding:6px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;font-weight:400}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
button.d{color:var(--rd)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.st div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.st b{display:block;font-size:20px}.st span{font-size:12px;color:var(--mu)}
.r{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin-right:4px}
.li{display:flex;gap:10px}.li img{width:84px;height:84px;object-fit:cover;border-radius:8px}
.hide{display:none}a.btn{display:inline-block;text-decoration:none;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;color:var(--tx)}
#pa{display:none}
@media print{body>.w{display:none}#pa{display:block;color:#000;background:#fff}}
/* Login screen removed; dashboard is the app entry point. */
.w{padding-bottom:96px}
input,select,textarea{font-size:16px}button,a.btn{min-height:40px}
nav button{position:relative}
</style></head><body>
<div class="w">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1 id="ttl">Property Desk</h1><span id="sy" class="mu" style="font-size:12px;text-align:right"></span></div>
<nav id="nav"></nav>
<div id="v"></div>
</div>
<div id="pa"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const K='propdesk_v1';
let S={listings:[],leads:[],set:{biz:'Vortexedge Real Estate',phone:'',sale:5,rent:10},chk:{},groups:[],reqs:[]};
try{const x=localStorage.getItem(K);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const cache=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};const save=()=>{cache();qsync()};
try{localStorage.removeItem('pd_sess');localStorage.removeItem('pd_snap');localStorage.removeItem('pd_uid')}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COUNTRIES=["Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia","Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria","Burkina Faso","Burundi","Cabo Verde","Cambodia","Cameroon","Canada","Central African Republic","Chad","Chile","China","Colombia","Comoros","Congo","Costa Rica","Croatia","Cuba","Cyprus","Czechia","Democratic Republic of the Congo","Denmark","Djibouti","Dominica","Dominican Republic","Ecuador","Egypt","El Salvador","Equatorial Guinea","Eritrea","Estonia","Eswatini","Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana","Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti","Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy","Ivory Coast","Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kiribati","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius","Mexico","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar","Namibia","Nauru","Nepal","Netherlands","New Zealand","Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway","Oman","Pakistan","Palau","Palestine","Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia","Rwanda","Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines","Samoa","San Marino","Sao Tome and Principe","Saudi Arabia","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands","Somalia","South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland","Syria","Taiwan","Tajikistan","Tanzania","Thailand","Timor-Leste","Togo","Tonga","Trinidad and Tobago","Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates","United Kingdom","United States","Uruguay","Uzbekistan","Vanuatu","Vatican City","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"];
const NG_STATES=["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT Abuja","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"];
const CURR=(()=>{try{return Intl.supportedValuesOf('currency')}catch(e){return ['NGN','USD','GBP','EUR','CAD','AUD','ZAR','GHS','KES','UGX','TZS','AED','SAR','INR','CNY','JPY','CHF']}})();
const N=(n,c=(S.set&&S.set.currency)||'NGN')=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c,maximumFractionDigits:0}).format(Number(n||0))}catch(e){return c+' '+Number(n||0).toLocaleString()}};
const fmtDate=v=>v?new Date(v).toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}):'Date not recorded';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const wa=p=>{p=String(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='234'+p.slice(1);return p};
const STG=['New','Contacted','Viewing booked','Offer made','Closed – won','Lost'];
const SRC=['WhatsApp','Signboard','Walk-in','Facebook','Instagram','Referral','Jiji/PropertyPro','Other'];
const PLAN=['Confirm price against 3 similar listings nearby','Take 8–10 bright photos (front, rooms, compound, road)','Add the listing here and save','Share the WhatsApp text to 5 groups and your status','Post on Facebook Marketplace, Jiji and PropertyPro','Print the signboard and fix it on the property','Print flyers and drop them at nearby shops and estates','Message every past enquiry and agent contact','Book viewings in 2-hour slots for the same day','Follow up every lead within 1 hour of enquiry','Ask each visitor for a decision date before they leave','Collect the deposit or commitment fee the same day']
let tab='listings',edit=null,photo='',kitId=null;
const tabs=[['listings','<b>🏠</b>Listings'],['match','<b>🔗</b>Match'],['leads','<b>👥</b>Leads'],['fb','<b>📘</b>Facebook'],['plan','<b>✅</b>Plan'],['settings','<b>⚙️</b>Settings']];
function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';kitId=null;render()">${t[1]}${t[0]=='match'&&INB.length?'<span class="tag" style="position:absolute;margin:-3px 0 0 16px">'+INB.length+'</span>':''}</button>`).join('')}
function render(){document.getElementById('ttl').textContent=S.set.biz||'Property Desk';nav();({listings:vL,leads:vLd,fb:vFb,match:vM,plan:vP,settings:vS})[tab]();}
const $=id=>document.getElementById(id);
const price=l=>N(l.price,l.currency||S.set.currency)+(l.type=='Rent'?' / '+(l.per||'year'):'');
function stats(){
 const av=S.listings.filter(l=>l.status=='Available').length;
 const open=S.leads.filter(x=>!['Closed – won','Lost'].includes(x.stage)).length;
 const won=S.leads.filter(x=>x.stage=='Closed – won');
 let com={};won.forEach(x=>{const l=S.listings.find(l=>l.id==x.lid);if(l){const c=l.currency||S.set.currency||'NGN';com[c]=(com[c]||0)+l.price*(l.type=='Rent'?S.set.rent:S.set.sale)/100}});const comText=Object.keys(com).length?Object.entries(com).map(([c,v])=>N(v,c)).join(' · '):N(0);
 const due=S.leads.filter(x=>x.fu&&x.fu<=new Date().toISOString().slice(0,10)&&!['Closed – won','Lost'].includes(x.stage)).length;
 return `<div class="st"><div><b>${av}</b><span>Available</span></div><div><b>${open}</b><span>Open leads</span></div><div><b>${due}</b><span>Follow-ups due</span></div><div><b>${allM().length}</b><span>Request matches</span></div><div><b>${won.length}</b><span>Deals closed</span></div><div><b style="font-size:14px">${comText}</b><span>Commission earned (by currency)</span></div></div>`}
function vL(){
 if(kitId)return vKit();
 const e=edit?S.listings.find(l=>l.id==edit):{};
 $('v').innerHTML=stats()+`<div class="c"><h2 style="margin-top:0">Describe a property in plain language</h2><p class="mu">Example: 3-bedroom detached duplex for sale in Lekki Phase 1, Lagos, Nigeria. Asking price USD 450,000. 4 bathrooms, swimming pool and title documents.</p><textarea id="listingPrompt" rows="3" placeholder="Paste or type the property description..."></textarea><div class="r"><button class="p" onclick="parseListingPrompt()">Extract details into listing</button></div></div><div class="c"><h2 style="margin-top:0">${edit?'Edit listing':'Add listing'}</h2>
 <div class="g">
 <div><label>Title</label><input id="t" value="${esc(e.title)}" placeholder="3-bedroom flat, Sabon Tasha"></div>
 <div><label>For</label><select id="ty"><option ${e.type=='Sale'?'selected':''}>Sale</option><option ${e.type=='Rent'?'selected':''}>Rent</option></select></div>
 <div><label>Property type</label><input id="k" value="${esc(e.kind)}" placeholder="Flat, duplex, land, shop"></div>
 <div><label>City / area / state</label><input id="lo" list="ngStateOptions" value="${esc(e.loc)}" placeholder="Kaduna, Lagos, London, Dubai..."><datalist id="ngStateOptions">${NG_STATES.map(x=>`<option value="${x}">`).join('')}</datalist></div>
 <div><label>Country</label><input id="co" list="countryOptions" value="${esc(e.country||'Nigeria')}" placeholder="Country"><datalist id="countryOptions">${COUNTRIES.map(x=>`<option value="${x}">`).join('')}</datalist></div>
 <div><label>Currency</label><select id="cu" onchange="$('priceCurrency').textContent=this.value">${CURR.map(c=>`<option value="${c}" ${(e.currency||S.set.currency||'NGN')==c?'selected':''}>${c}</option>`).join('')}</select></div>
 <div><label>Price (<span id="priceCurrency">${esc(e.currency||S.set.currency||'NGN')}</span>)</label><input id="pr" type="number" value="${e.price||''}"></div>
 <div><label>Rent period</label><select id="pe"><option ${e.per=='year'?'selected':''}>year</option><option ${e.per=='month'?'selected':''}>month</option></select></div>
 <div><label>Bedrooms</label><input id="bd" type="number" value="${e.beds||''}"></div>
 <div><label>Bathrooms</label><input id="ba" type="number" value="${e.baths||''}"></div>
 <div><label>Status</label><select id="sx">${['Available','Under offer','Closed'].map(s=>`<option ${e.status==s?'selected':''}>${s}</option>`).join('')}</select></div>
 <div><label>Photo</label><input id="ph" type="file" accept="image/*" onchange="pick(this)"></div>
 </div><div style="margin-top:8px"><label>Key features and selling points</label><textarea id="de" rows="3" placeholder="Title document, water, power, security, access road, payment terms">${esc(e.desc)}</textarea></div>
 <div class="r"><button class="p" onclick="saveL()">${edit?'Update':'Save listing'}</button>${edit?'<button onclick="edit=null;photo=\'\';render()">Cancel</button>':''}</div></div>`+
 (S.listings.length?S.listings.map(l=>`<div class="c"><div class="li">${l.photo?`<img src="${l.photo}" alt="">`:''}<div style="flex:1"><b>${esc(l.title)}</b><div><span class="tag">For ${l.type}</span><span class="tag">${esc(l.status)}</span></div><div>${price(l)}</div><div class="mu">${esc(l.loc)}${l.country?', '+esc(l.country):''} ${l.beds?'· '+l.beds+' bed':''} ${l.baths?'· '+l.baths+' bath':''}</div><div class="mu">${S.leads.filter(x=>x.lid==l.id).length} leads · ${matchesFor(l).length} matching requests</div></div></div>
 <div class="r"><button class="p" onclick="kitId='${l.id}';render()">Marketing kit</button><button onclick="edit='${l.id}';photo='';render();scrollTo(0,0)">Edit</button><button class="d" onclick="delL('${l.id}')">Delete</button></div></div>`).join(''):'<p class="mu">No listings yet. Add your first one above.</p>');
}
function parseListingPrompt(){const raw=$('listingPrompt').value.trim();if(raw.length<12){alert('Enter a fuller property description first.');return}const d=pLst(raw);$('t').value=d.title;$('ty').value=d.tx;$('k').value=d.kind||'';$('lo').value=d.loc||'';$('co').value=d.country||'Nigeria';$('cu').value=d.currency||'NGN';$('pr').value=d.price||'';$('pe').value=d.per||'year';$('bd').value=d.beds||'';$('de').value=raw;if(!d.price)alert('Details extracted. Enter the price manually because it was not detected.');document.getElementById('de').focus()}
function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)}
function saveL(){
 const o={title:$('t').value.trim(),type:$('ty').value,kind:$('k').value,loc:$('lo').value,country:$('co').value.trim()||'Nigeria',currency:$('cu').value||'NGN',price:+$('pr').value,per:$('pe').value,beds:$('bd').value,baths:$('ba').value,status:$('sx').value,desc:$('de').value};
 if(!o.title||!o.price){alert('Add a title and a price.');return}
 if(edit){const l=S.listings.find(l=>l.id==edit);Object.assign(l,o);if(photo)l.photo=photo}else S.listings.unshift(Object.assign({id:uid(),photo},o));
 edit=null;photo='';save();render()}
function delL(id){if(confirm('Delete this listing?')){S.listings=S.listings.filter(l=>l.id!=id);save();render()}}
function txt(l){const s=S.set;return `🏠 *FOR ${l.type.toUpperCase()}*\n*${l.title}*\n📍 ${l.loc||''}${l.country?', '+l.country:''}\n💰 ${price(l)}${l.beds?`\n🛏 ${l.beds} bed`:''}${l.baths?` · 🚿 ${l.baths} bath`:''}${l.desc?'\n\n'+l.desc:''}\n\n📞 ${s.biz}${s.phone?'\nCall/WhatsApp: '+s.phone:''}\nViewing available. Message now to book.`}
function vKit(){
 const l=S.listings.find(l=>l.id==kitId);if(!l){kitId=null;return render()}
 const link=`https://wa.me/${wa(S.set.phone)}?text=${encodeURIComponent('Hi, I am interested in: '+l.title)}`;
 $('v').innerHTML=`<button onclick="kitId=null;render()">← Back</button><div class="c" style="margin-top:10px"><b>${esc(l.title)}</b> <span class="mu">${price(l)}</span>
 ${S.set.phone?'':'<p class="mu" style="color:var(--rd)">Add your phone number in Settings so flyers, signboards and the QR code carry it.</p>'}
 <h2>WhatsApp and social post</h2><textarea id="kt" rows="9">${esc(txt(l))}</textarea>
 <div class="r"><button class="p" onclick="navigator.clipboard.writeText($('kt').value).then(()=>this.textContent='Copied')">Copy text</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt(l))}">Share on WhatsApp</a></div>
 <h2>Offline materials</h2><div class="r"><button onclick="printFlyer('${l.id}')">Print flyer</button><button onclick="printSign('${l.id}')">Print signboard (A4)</button></div>
 ${kitMatches(l)}<h2>Enquiry QR code</h2><p class="mu">Anyone who scans it opens WhatsApp with your listing already typed.</p><div id="qr" style="background:#fff;display:inline-block;padding:8px"></div></div>`;
 try{new QRCode($('qr'),{text:link,width:160,height:160})}catch(e){$('qr').textContent='QR code could not load (check your connection).'}}
function qrImg(l){const d=document.createElement('div');try{new QRCode(d,{text:`https://wa.me/${wa(S.set.phone)}?text=${encodeURIComponent('Hi, I am interested in: '+l.title)}`,width:150,height:150})}catch(e){}return d.innerHTML}
function printFlyer(id){const l=S.listings.find(l=>l.id==id);
 $('pa').innerHTML=`<div style="font-family:Arial,sans-serif;padding:20px;text-align:center"><div style="background:#0f6b4f;color:#fff;font-size:34px;font-weight:700;padding:10px">FOR ${l.type.toUpperCase()}</div>${l.photo?`<img src="${l.photo}" style="width:100%;max-height:420px;object-fit:cover;margin-top:12px">`:''}<h1 style="font-size:30px;margin:12px 0 4px">${esc(l.title)}</h1><div style="font-size:18px">${esc(l.loc)}</div><div style="font-size:32px;font-weight:700;margin:8px 0">${price(l)}</div><div style="font-size:18px">${l.beds?l.beds+' bed':''} ${l.baths?'· '+l.baths+' bath':''}</div><p style="font-size:16px;white-space:pre-wrap">${esc(l.desc)}</p><div style="display:flex;justify-content:center;align-items:center;gap:20px;margin-top:10px">${qrImg(l)}<div style="font-size:22px;font-weight:700">${esc(S.set.biz)}<br>${esc(S.set.phone)}</div></div></div>`;setTimeout(()=>print(),300)}
function printSign(id){const l=S.listings.find(l=>l.id==id);
 $('pa').innerHTML=`<div style="font-family:Arial,sans-serif;text-align:center;padding:30px;border:12px solid #0f6b4f;min-height:90vh"><div style="font-size:110px;font-weight:900;line-height:1">FOR<br>${l.type.toUpperCase()}</div><div style="font-size:40px;margin:24px 0">${esc(l.kind||'')} ${l.beds?'· '+l.beds+' bed':''}</div><div style="font-size:70px;font-weight:800;color:#0f6b4f">${esc(S.set.phone||'Add phone in Settings')}</div><div style="font-size:34px;margin-top:20px">${esc(S.set.biz)}</div><div style="margin-top:20px">${qrImg(l)}</div></div>`;setTimeout(()=>print(),300)}
function vLd(){
 const td=new Date().toISOString().slice(0,10);
 $('v').innerHTML=`<div class="c"><h2 style="margin-top:0">Log an enquiry</h2><div class="g">
 <div><label>Name</label><input id="ln"></div><div><label>Phone</label><input id="lp" type="tel"></div>
 <div><label>Listing</label><select id="ll"><option value="">General</option>${S.listings.map(l=>`<option value="${l.id}">${esc(l.title)}</option>`).join('')}</select></div>
 <div><label>Source</label><select id="ls">${SRC.map(s=>`<option>${s}</option>`).join('')}</select></div>
 <div><label>Follow up on</label><input id="lf" type="date" value="${td}"></div></div>
 <div style="margin-top:8px"><label>Note</label><input id="lt" placeholder="Budget, preferred viewing time, concerns"></div>
 <div class="r"><button class="p" onclick="addLead()">Save lead</button></div></div>`+
 (S.leads.length?S.leads.map(x=>{const l=S.listings.find(l=>l.id==x.lid);const due=x.fu&&x.fu<=td&&!['Closed – won','Lost'].includes(x.stage);return `<div class="c"><b>${esc(x.name)}</b> <span class="tag">${esc(x.src)}</span>${due?'<span class="tag" style="background:#fde7e5;color:var(--rd)">Follow up now</span>':''}<div class="mu">${esc(x.phone)} · ${l?esc(l.title):'General'}${x.fu?' · follow up '+x.fu:''}</div><div>${esc(x.note)}</div>

  h+='<div><label>For</label><select onchange="mDraft['+i+'].tx=this.value"><option '+(d.tx=='Sale'?'selected':'')+'>Sale</option><option '+(d.tx=='Rent'?'selected':'')+'>Rent</option></select></div><div><label>Area / city</label><input value="'+esc(d.loc)+'" oninput="mDraft['+i+'].loc=this.value"></div><div><label>Country</label><input value="'+esc(d.country||'Nigeria')+'" oninput="mDraft['+i+'].country=this.value"></div><div><label>Currency</label><select onchange="mDraft['+i+'].currency=this.value">'+CURR.map(c=>'<option value="'+c+'" '+((d.currency||'NGN')==c?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div><label>Type</label><input value="'+esc(d.kind)+'" oninput="mDraft['+i+'].kind=this.value"></div><div><label>Beds</label><input type="number" value="'+(d.beds||'')+'" oninput="mDraft['+i+'].beds=+this.value"></div><div><label>'+(q?'Budget':'Price')+' ('+(d.currency||'NGN')+')</label><input type="number" value="'+((q?d.budget:d.price)||'')+'" oninput="mDraft['+i+'].'+(q?'budget':'price')+'=+this.value"></div>';
  if(!q)h+='<div><label>Rent period</label><select onchange="mDraft['+i+'].per=this.value"><option '+(d.per=='year'?'selected':'')+'>year</option><option '+(d.per=='month'?'selected':'')+'>month</option></select></div>';
  return h+'</div></div>';
 }).join('')+'<div class="r"><button class="p" onclick="mSave()">Save selected</button>'+(mMode=='mixed'?'<span class="mu">'+mDraft.filter(d=>d.classification=='review').length+' item(s) need review</span>':'')+'</div>';
}
function mSave(){
 let sk=0,review=0,reqs=0,lsts=0;const remaining=[];
 mDraft.filter(d=>d.ok).forEach(d=>{
  const kind=mMode=='req'?'request':mMode=='lst'?'listing':d.classification;
  if(kind=='review'){review++;remaining.push(d);return}
  if(kind=='request'){
   S.reqs.unshift({id:uid(),name:d.name,phone:d.phone,tx:d.tx,loc:d.loc,country:d.country||'Nigeria',currency:d.currency||'NGN',kind:d.kind,beds:d.beds,budget:d.budget,url:d.url||'',src:d.src,raw:d.raw,at:Date.now()});reqs++;
  }else if(!d.price||!d.title){sk++;remaining.push(d)}
  else{S.listings.unshift({id:uid(),photo:'',title:d.title,type:d.tx,kind:d.kind,loc:d.loc,country:d.country||'Nigeria',currency:d.currency||'NGN',price:d.price,per:d.per||'year',beds:d.beds||'',baths:'',status:'Available',desc:d.raw});lsts++}
 });
 const unchecked=mDraft.filter(d=>!d.ok);mDraft=remaining.concat(unchecked);
 markInb(mDraft.filter(d=>d.ok&&d.inboxId).map(d=>d.inboxId));save();
 if(mDraft.length){render()}else{mDraft=null;mMode='';render()}
 const notes=[];if(reqs)notes.push(reqs+' request(s) saved');if(lsts)notes.push(lsts+' listing(s) saved');if(review)notes.push(review+' item(s) remain for classification');if(sk)notes.push(sk+' listing(s) need a title and price');if(notes.length)alert(notes.join('. ')+'.');
}

(function startPropertyDesk(){
  const boot = () => {
    try {
      if (!S.set) S.set = {biz:'Property Desk',phone:'',sale:5,rent:10};
      if (!Array.isArray(S.listings)) S.listings=[];
      if (!Array.isArray(S.leads)) S.leads=[];

      if (!Array.isArray(S.groups)) S.groups=[];
      if (!S.chk) S.chk={};
      render();
    } catch (err) {
      console.error('Property Desk startup failed:', err);
      const root=document.getElementById('v');
      if(root) root.innerHTML='<div class="c"><h2>Property Desk could not start</h2><p class="mu">The app encountered a startup error. Reload the page. If it continues, clear this site\'s cached files and reload.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></div>';
      const pre=root&&root.querySelector('pre'); if(pre) pre.textContent=String(err&&err.stack||err);
    }
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true});
  else boot();
})();
